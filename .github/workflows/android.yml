name: Build Android remote app (APK)

on:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Build Mobile APK
      run: |
        cd mobile
        npm install
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Verify APK Build
      run: echo "Android APK build completed successfully."
