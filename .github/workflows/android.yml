name: Build Android remote app (APK)

on:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies and Sync Capacitor
      run: |
        npm install
        cd mobile
        npm install
        npx cap sync android

    - name: Build Mobile APK (Debug)
      run: |
        cd mobile/android
        chmod +x gradlew
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

    - name: Verify APK Build
      run: echo "Android APK build completed successfully."
